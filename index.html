<title>跃 - 每日工作台</title>
<style>
:root{
  --primary:#FF6B35;--primary-light:#FF8C42;--primary-dark:#E55525;
  --secondary:#004E89;--bg:#F5F7FA;--card-bg:#FFFFFF;
  --text:#2D3436;--text-2:#636E72;--text-3:#9DA5AD;
  --success:#00B894;--danger:#D63031;--warning:#FDCB6E;
  --border:#E8ECF0;--shadow:0 2px 8px rgba(0,0,0,0.06);
  --shadow-lg:0 4px 16px rgba(0,0,0,0.1);
  --radius:12px;--radius-sm:8px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  padding-top:calc(48px + env(safe-area-inset-top));
  -webkit-font-smoothing:antialiased;
}
#topbar{
  position:fixed;top:0;left:0;right:0;height:calc(48px + env(safe-area-inset-top));
  padding-top:env(safe-area-inset-top);
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;display:flex;align-items:center;padding:0 16px;z-index:100;
  box-shadow:0 2px 8px rgba(255,107,53,0.3);
}
#topbar h1{font-size:18px;font-weight:700;flex:1;text-align:center}
#menuToggle{
  background:none;border:none;color:#fff;font-size:22px;cursor:pointer;
  width:40px;height:40px;display:flex;align-items:center;justify-content:center;
}
#dateDisplay{font-size:12px;opacity:0.9;text-align:right;min-width:80px}
#sidebar{
  position:fixed;top:calc(48px + env(safe-area-inset-top));left:0;bottom:0;
  width:260px;background:#fff;z-index:200;transform:translateX(-100%);
  transition:transform 0.3s ease;box-shadow:var(--shadow-lg);
  overflow-y:auto;padding-bottom:20px;
}
#sidebar.open{transform:translateX(0)}
.nav-header{
  padding:24px 20px 16px;font-size:22px;font-weight:800;
  background:linear-gradient(135deg,var(--primary),var(--primary-light));
  color:#fff;margin-bottom:8px;
}
.nav-header small{display:block;font-size:12px;font-weight:400;opacity:0.8;margin-top:4px}
.nav-item{
  display:flex;align-items:center;padding:14px 20px;cursor:pointer;
  color:var(--text);font-size:15px;border-left:3px solid transparent;
  transition:all 0.2s;min-height:48px;
}
.nav-item:hover{background:var(--bg)}
.nav-item.active{background:#FFF4EF;color:var(--primary);border-left-color:var(--primary);font-weight:600}
.nav-item .icon{margin-right:12px;font-size:18px}
#overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.4);
  z-index:150;opacity:0;visibility:hidden;transition:all 0.3s;
}
#overlay.show{opacity:1;visibility:visible}
#content{padding:16px 12px 80px;max-width:680px;margin:0 auto}
.section{display:none;animation:fadeIn 0.3s ease}
.section.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-size:20px;font-weight:700;margin-bottom:4px;color:var(--text)}
.section-sub{font-size:13px;color:var(--text-2);margin-bottom:16px}
.card{
  background:var(--card-bg);border-radius:var(--radius);padding:16px;
  margin-bottom:12px;box-shadow:var(--shadow);transition:transform 0.15s;
}
.card:active{transform:scale(0.99)}
.card-title{font-size:16px;font-weight:600;margin-bottom:8px}
.badge{
  display:inline-block;padding:2px 8px;border-radius:10px;
  font-size:11px;font-weight:600;margin-right:4px;
}
.badge-primary{background:#FFF4EF;color:var(--primary)}
.badge-success{background:#E6FAF5;color:var(--success)}
.badge-warning{background:#FFF8E1;color:#B8860B}
.badge-danger{background:#FDEAEA;color:var(--danger)}
.badge-info{background:#E3F2FD;color:var(--secondary)}
.badge-gray{background:#F0F2F5;color:var(--text-2)}
.tag{
  display:inline-block;padding:3px 10px;background:var(--bg);
  border-radius:6px;font-size:12px;color:var(--text-2);margin:2px;
}
.tabs{display:flex;gap:0;margin-bottom:16px;background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
.tab{
  flex:1;padding:10px 8px;text-align:center;cursor:pointer;
  font-size:14px;color:var(--text-2);border-bottom:2px solid transparent;
  transition:all 0.2s;min-height:44px;display:flex;align-items:center;justify-content:center;
}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600;background:#FFF8F5}
.timeline-item{position:relative;padding-left:32px;padding-bottom:16px}
.timeline-item:last-child{padding-bottom:0}
.timeline-item::before{
  content:'';position:absolute;left:8px;top:24px;bottom:0;width:2px;background:var(--border);
}
.timeline-item:last-child::before{display:none}
.timeline-num{
  position:absolute;left:0;top:0;width:20px;height:20px;border-radius:50%;
  background:var(--primary);color:#fff;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.diff-easy{color:#00B894}.diff-mid{color:#FDCB6E}.diff-hard{color:#D63031}
.news-item{
  padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer;
  display:flex;gap:10px;align-items:flex-start;
}
.news-item:last-child{border-bottom:none}
.news-num{
  flex-shrink:0;width:22px;height:22px;border-radius:50%;
  background:var(--bg);color:var(--text-2);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.news-item:nth-child(-n+3) .news-num{background:#FFF4EF;color:var(--primary)}
.news-title{font-size:14px;font-weight:500;line-height:1.4}
.news-meta{font-size:11px;color:var(--text-3);margin-top:4px}
.news-detail{display:none;padding:8px 0 4px;font-size:13px;color:var(--text-2);line-height:1.6}
.news-item.expanded .news-detail{display:block}
.stock-card{border-left:4px solid var(--border);position:relative;overflow:hidden}
.stock-card.rank-1{border-left-color:#FFD700}
.stock-card.rank-2{border-left-color:#C0C0C0}
.stock-card.rank-3{border-left-color:#CD7F32}
.stock-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.stock-name{font-size:17px;font-weight:700}
.stock-code{font-size:12px;color:var(--text-3);margin-top:2px}
.stock-rank{
  width:28px;height:28px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-weight:700;font-size:14px;color:#fff;
}
.rank-1 .stock-rank{background:#FFD700;color:#8B6914}
.rank-2 .stock-rank{background:#C0C0C0;color:#555}
.rank-3 .stock-rank{background:#CD7F32}
.stock-price{font-size:22px;font-weight:700;margin-right:8px}
.stock-change{font-size:14px;font-weight:600}
.up{color:var(--danger)}.down{color:var(--success)}
.score-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0}
.score-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--primary),var(--primary-light));transition:width 0.5s}
.factor-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.factor{background:var(--bg);border-radius:6px;padding:8px;text-align:center}
.factor-label{font-size:11px;color:var(--text-3);margin-bottom:2px}
.factor-val{font-size:15px;font-weight:700;color:var(--primary)}
.factor-val.high{color:var(--success)}.factor-val.low{color:var(--danger)}
.analysis-box{background:#FFF8F5;border-radius:8px;padding:10px;margin-top:10px}
.analysis-verdict{font-size:14px;font-weight:600;color:var(--primary);margin-bottom:6px}
.analysis-list{font-size:12px;color:var(--text-2);line-height:1.6}
.analysis-list li{margin:2px 0;padding-left:16px;position:relative;list-style:none}
.analysis-list li::before{content:'✓';position:absolute;left:0;color:var(--success);font-weight:700}
.analysis-list.weak li::before{content:'!';color:var(--warning)}
.btn{
  display:inline-block;padding:10px 20px;border-radius:8px;border:none;
  font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s;
  min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:4px;
}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:active{background:var(--primary-dark)}
.btn-outline{background:#fff;color:var(--primary);border:1px solid var(--primary)}
.btn-outline:active{background:#FFF4EF}
.btn-gray{background:var(--bg);color:var(--text-2)}
.meal-card{border-radius:var(--radius);padding:16px;margin-bottom:12px}
.meal-breakfast{background:#FFF8E1;border-left:4px solid #FFC107}
.meal-lunch{background:#E8F5E9;border-left:4px solid #4CAF50}
.meal-dinner{background:#E3F2FD;border-left:4px solid #2196F3}
.meal-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.meal-breakfast .meal-label{color:#B8860B}
.meal-lunch .meal-label{color:#2E7D32}
.meal-dinner .meal-label{color:#1565C0}
.meal-name{font-size:17px;font-weight:700;margin-bottom:6px}
.meal-meta{font-size:12px;color:var(--text-2);margin-bottom:10px}
.meal-steps{counter-reset:step;margin-top:8px}
.meal-steps li{counter-increment:step;padding-left:24px;position:relative;margin:6px 0;font-size:13px;list-style:none}
.meal-steps li::before{content:counter(step);position:absolute;left:0;top:0;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,0.08);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.mgmt-item{cursor:pointer}
.mgmt-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.mgmt-title{font-size:15px;font-weight:600;flex:1}
.mgmt-arrow{color:var(--text-3);transition:transform 0.2s;flex-shrink:0}
.mgmt-item.expanded .mgmt-arrow{transform:rotate(180deg)}
.mgmt-summary{font-size:13px;color:var(--text-2);margin-top:4px}
.mgmt-detail{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);font-size:13px;line-height:1.7;color:var(--text)}
.mgmt-item.expanded .mgmt-detail{display:block}
.mgmt-source{font-size:12px;color:var(--text-3);margin-top:8px;font-style:italic}
#strategyPanel{
  position:fixed;top:0;right:0;bottom:0;width:320px;background:#fff;z-index:300;
  transform:translateX(100%);transition:transform 0.3s;overflow-y:auto;
  padding-top:env(safe-area-inset-top);box-shadow:var(--shadow-lg);
}
#strategyPanel.open{transform:translateX(0)}
.strategy-head{padding:16px;background:var(--primary);color:#fff;display:flex;justify-content:space-between;align-items:center}
.strategy-head h3{font-size:17px}
.strategy-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer;width:36px;height:36px}
.strategy-body{padding:16px}
.strategy-item{margin-bottom:16px}
.strategy-item label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.strategy-item .hint{font-size:11px;color:var(--text-3);margin-top:2px}
.strategy-item input[type=range]{width:100%;height:36px}
.strategy-item input[type=number]{width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:14px}
.strategy-actions{position:sticky;bottom:0;background:#fff;padding:12px 16px;border-top:1px solid var(--border);display:flex;gap:8px}
#pwaTip{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(45,52,54,0.95);color:#fff;padding:12px 16px;border-radius:10px;
  font-size:13px;z-index:250;max-width:340px;display:flex;align-items:center;gap:10px;
  box-shadow:var(--shadow-lg);
}
#pwaTip .close{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;flex-shrink:0}
.loading{display:flex;justify-content:center;align-items:center;padding:40px;color:var(--text-3)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin 0.8s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.disclaimer{font-size:11px;color:var(--text-3);text-align:center;padding:16px;line-height:1.6}
.build-info{font-size:11px;color:var(--text-3);text-align:center;padding:8px;margin-top:8px}
.empty{text-align:center;padding:40px 20px;color:var(--text-3);font-size:14px}
@media(min-width:768px){
  #sidebar{transform:translateX(0);box-shadow:none}
  #content{margin-left:260px;max-width:720px}
  #overlay{display:none!important}
  #menuToggle{display:none}
}
</style>
</head>

</div>

  "management": [
    {
      "title": "利益相关者分析与管理",
      "category": "项目管理",
      "summary": "识别项目利益相关方，按权力-利益制定差异化沟通策略",
      "content": "利益相关者管理是项目成功的关键，据统计项目失败有70%源于利益相关者管理不当而非技术问题。识别方法：用权力-利益矩阵（Power-Interest Grid）将利益相关方分四类：1）重点管理（高权力高利益）——项目发起人、核心客户、关键决策者。需要密切管理，定期深度沟通，确保支持。投入最多精力；2）保持满意（高权力低利益）——财务部、法务等审批方。需要让他们满意但不打扰。提供简洁的项目摘要和关键里程碑信息；3）保持告知（低权力高利益）——团队成员、最终用户、直接受影响者。定期通报项目进展，获取反馈。用周报或站会；4）监督（低权力低利益）——外围人员、间接相关者。低频监控即可。管理流程：1）识别——列出所有受项目影响或能影响项目的人/组织；2）分析——评估每个相关方的权力、利益、态度（支持/中立/反对）、影响力；3）制定策略——为每个相关方制定沟通计划（频率、方式、内容、负责人）；4）执行与调整——按计划沟通，根据反馈调整策略。关键技巧：1）尽早识别潜在反对者——了解其顾虑，争取转化为支持者；2）找到关键影响者——争取关键人物背书，影响其他人；3）建立利益相关者地图——可视化展示关系网络。注意事项：利益相关者的态度和权力会变化，需定期重新评估。",
      "source": "PMBOK / 利益相关者理论",
      "author": "R·爱德华·弗里曼",
      "tags": [
        "利益相关者",
        "项目管理",
        "沟通",
        "经典"
      ]
    },
    {
      "title": "敏捷规模化：SAFe框架",
      "category": "项目管理",
      "summary": "在大型组织中协调多个敏捷团队，实现规模化敏捷交付",
      "content": "SAFe（Scaled Agile Framework）是大型组织规模化敏捷的框架，适用于50人以上的多团队协作。四个层级：1）团队层——5-9人的敏捷团队，使用Scrum或看板，2周冲刺；2）项目群层（ART，敏捷发布火车）——5-12个团队（50-125人）协同交付，每8-12周一次PI（项目群增量）规划会议。设RTE（发布火车工程师）协调；3）解决方案层——多个ART协同交付大型解决方案。设STE（解决方案火车工程师）；4）投资组合层——战略与预算分配，设精益投资组合管理（LPM）。核心机制：1）PI Planning——所有团队集中2天制定下一PI的计划，是SAFe的心脏。所有团队同步目标、识别依赖、规划里程碑；2）系统Demo——每PI结束全系统演示，所有团队成果集成展示；3）Inspect & Adapt——PI结束后的问题解决工作坊，持续改进；4）架构跑道——建立足够的技术基础架构支持快速迭代。实施建议：1）先试点一个ART再推广；2）高层培训至关重要（SAFe需领导层认同）；3）不要教条照搬——根据组织特点裁剪；4）重视PI Planning的线下集中（虚拟效果打折）。争议：SAFe被批评”过于重型”，偏离敏捷初心。适用场景：大型企业需跨团队协调、合规要求高、传统行业转型。注意事项：SAFe是手段不是目的，核心仍是为客户持续交付价值。",
      "source": "《SAFe 5.0参考指南》",
      "author": "迪恩·莱芬韦尔",
      "tags": [
        "SAFe",
        "规模化敏捷",
        "大型组织",
        "现代"
      ]

      "content": "5Why法由丰田创始人丰田佐吉发明，大野耐一在丰田生产系统中推广。核心理念：问题的表象往往不是真正原因，需通过连续追问深入到根因。经典案例：1）现象：机器停了。为什么？→保险丝断了；2）为什么保险丝断？→超载了；3）为什么超载？→轴承润滑不足；4）为什么润滑不足？→油泵吸不上油；5）为什么吸不上油？→油泵磨损且无定期维护计划。根因：缺少预防性维护制度（而非简单换保险丝）。实施要点：1）基于事实而非推测——每一步”为什么”需有数据和观察支撑，不能凭空猜测。现场观察（三现主义：现场、现物、现实）至关重要；2）聚焦流程而非人——追问”为什么这个流程允许错误发生”而非”谁犯的错”。目标是改进系统而非追责；3）不一定恰好5个——可能3次就找到根因，也可能需要7-8次。关键是问到可采取改进行动为止；4）可能有多个根因——一个问题可能有多条因果链，需逐一分析。使用鱼骨图辅助识别可能的根因维度（人、机、料、法、环、测）；5）验证根因——找到根因后，反向验证：如果这个根因消除，问题还会发生吗？注意事项：5Why易学难精，需训练”打破砂锅问到底”的思维；避免将”人的疏忽”作为根因（疏忽是表象，应追问为何疏忽未被防住）；与PDCA结合——找到根因后立即制定改进措施并标准化。",

      "summary": "用因果图系统化识别问题的所有可能原因",
      "content": "鱼骨图（因果图）由石川馨提出，是质量管理的七大基本工具之一。结构：鱼头（右端）写问题，鱼骨（主线）画水平线，鱼刺（斜线）标注原因类别，每个类别下细分具体原因。6M分析维度：1）人（Man）——技能不足、疲劳、态度、培训不够、人员变动；2）机（Machine）——设备故障、精度不足、维护不当、容量不够；3）料（Material）——原材料质量、供应商变化、规格不符、库存问题；4）法（Method）——流程缺陷、标准缺失、操作不当、参数设定；5）环（Environment）——温湿度、照明、噪声、布局、安全；6）测（Measurement）——测量方法、仪器精度、标准偏差。实施步骤：1）明确问题——在鱼头处清晰描述问题；2）确定类别——选择合适的6M维度（或自定义维度）；3）头脑风暴——团队共创，对每个维度问”在这个方面可能有什么原因导致问题？”；4）细化原因——对每个识别的原因继续追问”为什么会这样？”，形成因果链；5）标记主因——用投票或数据排序，标记最可能的3-5个关键原因；6）验证和改进——对关键原因收集数据验证，制定改进措施。与5Why结合使用：鱼骨图识别广度，5Why挖掘深度。注意事项：鱼骨图是发散工具不提供解决方案；需团队共创而非个人绘制；原因需基于数据和现场观察而非主观猜测。",

      "content": "MVP（Minimum Viable Product）是精益创业的核心工具，目的是用最小成本验证最危险的假设。注意：MVP不是”烂产品”，而是”能学习的产品”。MVP类型（从轻到重）：1）冒烟测试——做一个着陆页描述产品价值，放”立即购买”按钮，用户点击后显示”即将上线”。验证需求是否真实存在（如Buffer最初只有一个着陆页就获得了第一批用户）；2）绿野仙踪——前端看起来自动化，后端人工操作。如食品配送App初期创始人亲自送餐验证流程；3）原型——高保真原型用Figma等工具，放用户面前测试交互和需求；4）单一功能MVP——只做核心功能的极简版本。如Dropbox早期只有同步功能；5）顾问式MVP——不做产品，先人工服务客户，理解需求后再产品化。MVP设计原则：1）明确最危险假设——什么假设如果错了整个产品就失败？优先验证它。如”用户愿意为这个功能付费”或”用户每天会用3次以上”；2）定义成功标准——上线前明确什么数据算验证成功。如”7日留存>30%”或”付费转化>5%”；3）最小化但不简陋——MVP需提供完整的核心价值体验，不是残缺的产品。用户体验可以粗糙但不能无法使用；4）快速迭代——MVP周期尽量短（2-4周），基于用户反馈快速调整。注意事项：MVP需要勇气砍掉非核心功能；不要做”市场调研”替代MVP（说的和做的往往不同）；MVP验证的是假设不是产品。",

//=================== UTIL ===================
function $(s){return document.querySelector(s)}
function $$(s){return document.querySelectorAll(s)}
function esc(s){return String(s||'').replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))}
function getD(){return EMBED_DATA&&Object.keys(EMBED_DATA).length>1?EMBED_DATA:FALLBACK}
function dayOfYear(){const n=new Date();const s=new Date(n.getFullYear(),0,0);return Math.floor((n-s)/86400000)}
function todayStr(){const d=new Date();const w=['日','一','二','三','四','五','六'];return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 周${w[d.getDay()]}`}

//=================== NAV ===================
function initNav(){
  $('#menuToggle').onclick=()=>{$('#sidebar').classList.add('open');$('#overlay').classList.add('show')};
  $('#overlay').onclick=()=>{$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')};
  $$('.nav-item').forEach(item=>{
    item.onclick=()=>{
      const sec=item.dataset.section;
      $$('.nav-item').forEach(n=>n.classList.remove('active'));
      item.classList.add('active');
      $$('.section').forEach(s=>s.classList.remove('active'));
      $('#'+sec).classList.add('active');
      if(window.innerWidth<768){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')}
      renderSection(sec);
    };
  });
  $('#dateDisplay').textContent=todayStr();
}

var rendered={};
function renderSection(sec){
  if(rendered[sec])return;
  try{
    ({sport:renderSport,english:renderEnglish,diet:renderDiet,news:renderNews,stock:renderStock,management:renderManagement}[sec])();
    rendered[sec]=true;
  }catch(e){console.error('render',sec,e);$('#'+sec).innerHTML='<div class="empty">加载失败，请刷新重试</div>'}
}

//=================== SPORT ===================
function renderSport(){
  const d=getD();
  const wd=new Date().getDay();
  const schedule={0:'full_body',1:'abs',2:'glutes',3:'shoulders',4:'abs',5:'glutes',6:'shoulders'};
  const names={abs:'练腹',glutes:'练臀',shoulders:'练肩',full_body:'全身'};
  let s=d.sport;
  if(!s||!s.exercises||!s.exercises.length){s=FALLBACK.sport}
  const target=s.target||names[schedule[wd]]||'全身';
  const exs=s.exercises;
  let h=`<div class="section-title">🏃 每日运动</div>
    <div class="section-sub">今日训练：${esc(target)} | 总时长：${esc(s.duration||'30分钟')} | ${exs.length}个动作</div>`;
  exs.forEach((e,i)=>{
    const diff=e.difficulty||'初级';
    const dc=diff.includes('高')?'diff-hard':diff.includes('中')?'diff-mid':'diff-easy';
    h+=`<div class="card"><div class="timeline-item">
      <div class="timeline-num">${i+1}</div>
      <div class="card-title">${esc(e.name)}</div>
      <div style="margin:6px 0">
        <span class="badge badge-primary">${esc(e.sets||'3组')}</span>
        <span class="badge badge-info">${esc(e.duration||e.reps||'')}</span>
        <span class="badge ${diff.includes('高')?'badge-danger':diff.includes('中')?'badge-warning':'badge-success'} ${dc}">${esc(diff)}</span>
      </div>
      <div style="font-size:13px;color:var(--text-2);margin-top:6px">${esc(e.desc||'')}</div>
      ${e.tips?`<div style="font-size:12px;color:var(--primary);margin-top:8px;padding:6px 10px;background:#FFF8F5;border-radius:6px">💡 ${esc(e.tips)}</div>`:''}
    </div></div>`;
  });
  h+=`<div class="disclaimer">运动前请充分热身，量力而行，注意安全</div>`;
  if(EMBED_DATA.build_date){h+=`<div class="build-info">数据更新：${EMBED_DATA.build_date}</div>`}
  $('#sport').innerHTML=h;
}

//=================== DIET ===================
function renderDiet(){
  const d=getD();
  let dt=d.diet;
  if(!dt){dt=FALLBACK.diet}
  const meals=[['breakfast','早餐','meal-breakfast'],['lunch','午餐','meal-lunch'],['dinner','晚餐','meal-dinner']];
  let h=`<div class="section-title">🥗 健康饮食</div><div class="section-sub">今日三餐健康菜谱推荐</div>`;
  let total=0;
  meals.forEach(([key,label,cls])=>{
    const m=dt[key];
    if(!m)return;
    const cal=parseInt(m.calories)||0;total+=cal;
    let ing=(m.ingredients||[]).map(i=>`<span class="tag">${esc(i)}</span>`).join('');
    let st=(m.steps||[]).map(s=>`<li>${esc(s)}</li>`).join('');
    h+=`<div class="meal-card ${cls}">
      <div class="meal-label">${label}</div>
      <div class="meal-name">${esc(m.name)}</div>
      <div class="meal-meta">🔥 ${esc(m.calories||'')} | ⏱ ${esc(m.time||'')}</div>
      <div style="margin:8px 0"><div style="font-size:12px;color:var(--text-2);margin-bottom:4px">食材：</div>${ing}</div>
      <div><div style="font-size:12px;color:var(--text-2);margin-bottom:4px">步骤：</div><ol class="meal-steps">${st}</ol></div>
    </div>`;
  });
  h+=`<div class="card" style="text-align:center"><span style="font-size:14px;color:var(--text-2)">今日总热量</span><br><span style="font-size:24px;font-weight:700;color:var(--primary)">${total} kcal</span></div>`;
  $('#diet').innerHTML=h;
}

//=================== NEWS ===================
function renderNews(){
  const d=getD();
  let n=d.news;
  if(!n){n=FALLBACK.news}
  let h=`<div class="section-title">📰 财经新闻</div><div class="section-sub">每日实时新闻热点 | 财经资讯 | 电商动态</div>
    <div class="tabs">
      <div class="tab active" data-nt="hot">🔥 热点${(n.hot||[]).length}</div>
      <div class="tab" data-nt="finance">💰 财经${(n.finance||[]).length}</div>
      <div class="tab" data-nt="ecommerce">🛒 电商${(n.ecommerce||[]).length}</div>
    </div>
    <div id="newsContent"></div>`;
  $('#news').innerHTML=h;
  function renderList(key){
    const arr=n[key]||[];
    if(!arr.length)return '<div class="empty">暂无数据</div>';
    return arr.map((item,i)=>`<div class="news-item" onclick="this.classList.toggle('expanded')">
      <div class="news-num">${i+1}</div>
      <div style="flex:1">
        <div class="news-title">${esc(item.title)}</div>
        <div class="news-meta">${esc(item.source||'')} · ${esc(item.time||'')}</div>
        ${item.summary||item.content?`<div class="news-detail">${esc(item.summary||item.content)}</div>`:''}
      </div></div>`).join('');
  }
  function show(key){$('#newsContent').innerHTML='<div class="card">'+renderList(key)+'</div>'}
  show('hot');
  $$('#news .tab').forEach(t=>{
    t.onclick=()=>{
      $$('#news .tab').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      show(t.dataset.nt);
    };
  });
}

        </div>
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="color:var(--text-2)">综合评分</span><span style="font-weight:700;color:var(--primary)">${(p.total_score||0).toFixed(1)} / 100</span></div>
        <div class="score-bar"><div class="score-fill" style="width:${p.total_score||0}%"></div></div>
        <div class="factor-grid">
          ${factorBox('涨幅',sc.gain)}${factorBox('量能',sc.volume)}${factorBox('均线',sc.ma)}
          ${factorBox('MACD',sc.macd)}${factorBox('换手',sc.turnover)}${factorBox('市值',sc.cap)}
        </div>`;
      if(p.analysis){
        const a=p.analysis;
        h+=`<div class="analysis-box">
          <div class="analysis-verdict">${esc(a.verdict||'')}</div>`;
        if(a.strengths&&a.strengths.length){h+=`<ul class="analysis-list">${a.strengths.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`}
        if(a.weaknesses&&a.weaknesses.length){h+=`<ul class="analysis-list weak" style="margin-top:6px">${a.weaknesses.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`}
        h+=`</div>`;
      }
      h+=`</div>`;
    });
  }
  h+=`<div style="display:flex;gap:8px;margin:12px 0">
    <button class="btn btn-outline" style="flex:1" onclick="openStrategy()">⚙️ 调整策略参数</button>
    <button class="btn btn-outline" style="flex:1" onclick="toggleSource()">📋 查看选股源码</button>
  </div>
  <div id="stockSource" style="display:none"></div>
  <div class="disclaimer">⚠️ 以上结果基于技术指标自动生成，仅供参考，不构成投资建议。股市有风险，投资需谨慎。</div>`;
  if(EMBED_DATA.build_time){h+=`<div class="build-info">数据更新：${EMBED_DATA.build_date||''} ${EMBED_DATA.build_time||''}</div>`}
  $('#stock').innerHTML=h;
}
function factorBox(label,val){
  const v=(val||0).toFixed(0);
  const cls=v>=70?'high':v<40?'low':'';
  return `<div class="factor"><div class="factor-label">${label}</div><div class="factor-val ${cls}">${v}</div></div>`;
}

var strategyConfig={
  gain_min:2.0,gain_max:7.0,volume_ratio:1.5,turnover_min:3.0,turnover_max:15.0,
  market_cap_min:50,market_cap_max:500,weight_gain:25,weight_volume:25,weight_ma:20,
  weight_macd:15,weight_turnover:10,weight_cap:5
};
function openStrategy(){
  const items=[
    ['gain_min','最小涨幅(%)',0,15,0.5],['gain_max','最大涨幅(%)',0,20,0.5],
    ['volume_ratio','量比阈值',0.5,5,0.1],['turnover_min','最低换手率(%)',0,10,0.5],
    ['turnover_max','最高换手率(%)',5,30,1],['market_cap_min','最低市值(亿)',0,500,10],
    ['market_cap_max','最高市值(亿)',100,5000,100],
    ['weight_gain','涨幅权重',0,50,1],['weight_volume','量能权重',0,50,1],
    ['weight_ma','均线权重',0,50,1],['weight_macd','MACD权重',0,50,1],
    ['weight_turnover','换手率权重',0,50,1],['weight_cap','市值权重',0,50,1]
  ];
  let h='';
  items.forEach(([k,label,min,max,step])=>{
    h+=`<div class="strategy-item"><label>${label}：<strong id="v_${k}">${strategyConfig[k]}</strong></label>
      <input type="range" min="${min}" max="${max}" step="${step}" value="${strategyConfig[k]}" oninput="$('#v_${k}').textContent=this.value;strategyConfig['${k}']=parseFloat(this.value)"></div>`;
  });
  $('#strategyBody').innerHTML=h;
  $('#strategyPanel').classList.add('open');
}
function closeStrategy(){$('#strategyPanel').classList.remove('open')}
function resetStrategy(){
  Object.assign(strategyConfig,{gain_min:2.0,gain_max:7.0,volume_ratio:1.5,turnover_min:3.0,turnover_max:15.0,market_cap_min:50,market_cap_max:500,weight_gain:25,weight_volume:25,weight_ma:20,weight_macd:15,weight_turnover:10,weight_cap:5});
  openStrategy();
}
function applyStrategy(){
  // 前端重新评分（使用内嵌数据）
  const d=getD();
  const picks=(d.stock&&d.stock.picks)||[];
  if(!picks.length){closeStrategy();return}
  picks.forEach(p=>{
    const sc=p.scores||{};
    p.total_score=parseFloat(((
      (sc.gain||0)*strategyConfig.weight_gain/100+
      (sc.volume||0)*strategyConfig.weight_volume/100+
      (sc.ma||0)*strategyConfig.weight_ma/100+
      (sc.macd||0)*strategyConfig.weight_macd/100+
      (sc.turnover||0)*strategyConfig.weight_turnover/100+
      (sc.cap||0)*strategyConfig.weight_cap/100
    )).toFixed(1));
  });
  picks.sort((a,b)=>b.total_score-a.total_score);
  rendered.stock=false;
  renderStock();
  closeStrategy();
}

const STOCK_SOURCE=`# 🦞 小龙虾选股引擎 - 多因子技术指标评分模型
# 完整源码见 stock_picker.py，以下为核心逻辑摘要

class StockPickerConfig:
    \"\"\"选股参数配置 - 所有参数均可自定义修改\"\"\"
    gain_min = 2.0        # 最小涨幅 (%)
    gain_max = 7.0        # 最大涨幅 (%)
    turnover_min = 3.0    # 最低换手率 (%)
    turnover_max = 15.0   # 最高换手率 (%)
    market_cap_min = 50   # 最低市值 (亿)
    market_cap_max = 500  # 最高市值 (亿)
    ma_periods = [5, 10, 20]  # 均线周期
    macd_fast, macd_slow, macd_signal = 12, 26, 9
    volume_ratio_threshold = 1.5  # 量比阈值
    # 因子权重（总和100）
    weight_gain = 25      # 涨幅因子
    weight_volume = 25    # 量能因子
    weight_ma = 20        # 均线因子
    weight_macd = 15      # MACD因子
    weight_turnover = 10  # 换手率因子
    weight_cap = 5        # 市值因子

def score_gain(stock, config):
    \"\"\"涨幅评分：2%-7%最佳，越接近中间越高\"\"\"
    gain = (stock['price'] - stock['prev_close']) / stock['prev_close'] * 100
    if gain < config.gain_min or gain > config.gain_max:
        return 0
    optimal = (config.gain_min + config.gain_max) / 2
    return max(0, 100 * (1 - abs(gain - optimal) / 3))

def score_volume(stock, klines, config):
    \"\"\"量能评分：当日量 > 5日均量 × 阈值\"\"\"
    avg_vol = sum(k['volume'] for k in klines[-6:-1]) / 5
    ratio = stock['volume'] / avg_vol if avg_vol > 0 else 0
    if ratio < config.volume_ratio_threshold:
        return 0
    return min(100, (ratio - config.volume_ratio_threshold) / 1.5 * 100)

def score_ma(klines, config):
    \"\"\"均线评分：MA5 > MA10 > MA20 多头排列\"\"\"
    closes = [k['close'] for k in klines]
    ma5 = sum(closes[-5:]) / 5
    ma10 = sum(closes[-10:]) / 10
    ma20 = sum(closes[-20:]) / 20
    score = 0
    if closes[-1] > ma5: score += 30
    if ma5 > ma10: score += 30
    if ma10 > ma20: score += 25
    score += min(15, max(0, (ma5 - ma20) / ma20 * 300))
    return score

def score_macd(closes, config):
    \"\"\"MACD评分：DIF零轴上方 + 金叉 + 红柱放大\"\"\"
    ema12 = calc_ema(closes, 12)
    ema26 = calc_ema(closes, 26)
    dif = ema12 - ema26
    dea = calc_ema(dif, 9)
    score = 0
    if dif[-1] > 0: score += 40       # 零轴上方
    if dif[-1] > dea[-1]: score += 30  # 金叉
    hist = (dif[-1] - dea[-1]) * 2
    if hist > 0: score += 20           # 红柱
    if len(dif) >= 2 and hist > (dif[-2]-dea[-2])*2: score += 10
    return score

function initPWA(){
  if('serviceWorker'in navigator){
    // 单文件PWA：注册内联SW进行缓存
    try{
      const swCode=`self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request)))})`;
      const blob=new Blob([swCode],{type:'application/javascript'});
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
    }catch(e){}
  }
  // 添加到主屏幕提示
  if(!localStorage.getItem('pwaTipShown')){
    setTimeout(()=>{$('#pwaTip').style.display='flex';localStorage.setItem('pwaTipShown','1')},3000);
  }
}
